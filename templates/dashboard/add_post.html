{% extends 'base.html' %}

{% block content %}
 {% load crispy_forms_tags %}

<div class="row">
    <!--load sidebar-->
    {% include 'dashboard/sidebar.html' %}
   

    <!--right side content-->
    <div class="col-md-9">
        <h3> Add New Post </h3>
        <form action="{% url 'add_post' %}" method="POST" enctype="multipart/form-data">  <!--for files like images-->
            {% csrf_token %}
            {{ form | crispy }}

            <button type="submit" class="btn btn-info">Submit</button>
        </form>
        <br>

        

    </div>
</div>
{% endblock %}
